[package]
name = "cheri"
version = "0.4.27"
edition = "2021"
description = "Keyboard-driven desktop viewer for 4chan image/video threads (project.md milestone 0.4.0: viewer refinements)."
license = "MIT"
repository = "https://github.com/subbaan/1cheri"
publish = false

[[bin]]
name = "1cheri"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_8"] }
libmpv2 = "6.0.0"
epoxy = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
